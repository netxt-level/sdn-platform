services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sdn-backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sdn_platform}
      POSTGRES_USER: ${POSTGRES_USER:-sdn_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: 8086
      INFLUXDB_ORG: ${INFLUXDB_ORG:-sdn_org}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-sdn_metrics}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:?INFLUXDB_TOKEN is required}
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_HTTP_PORT: 9200
      ANALYZER_API_KEY: ${ANALYZER_API_KEY:?ANALYZER_API_KEY is required}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY is required}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      influxdb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)\""
        ]
      interval: 10s
      timeout: 3s
      retries: 6

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sdn-migrate
    restart: "no"
    command: alembic upgrade head
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sdn_platform}
      POSTGRES_USER: ${POSTGRES_USER:-sdn_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: 8086
      INFLUXDB_ORG: ${INFLUXDB_ORG:-sdn_org}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-sdn_metrics}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:?INFLUXDB_TOKEN is required}
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_HTTP_PORT: 9200
    depends_on:
      postgres:
        condition: service_healthy

  analyzer:
    build:
      context: ./analyzer
      dockerfile: Dockerfile
    container_name: sdn-analyzer
    restart: unless-stopped
    environment:
      ANALYZER_ID: ${ANALYZER_ID:-analyzer-1}
      ANALYZER_INTERFACE: ${ANALYZER_INTERFACE:-eth0}
      ANALYZER_WINDOW_SEC: ${ANALYZER_WINDOW_SEC:-1}
      ANALYZER_STATUS_INTERVAL_SEC: ${ANALYZER_STATUS_INTERVAL_SEC:-5}
      ANALYZER_PACKET_BUFFER_MAX_SIZE: ${ANALYZER_PACKET_BUFFER_MAX_SIZE:-100000}
      PORT_SCAN_WINDOW_SEC: ${PORT_SCAN_WINDOW_SEC:-5}
      PORT_SCAN_UNIQUE_DST_PORT_THRESHOLD: ${PORT_SCAN_UNIQUE_DST_PORT_THRESHOLD:-15}
      PORT_SCAN_SYN_COUNT_THRESHOLD: ${PORT_SCAN_SYN_COUNT_THRESHOLD:-30}
      PORT_SCAN_MULTI_TARGET_WINDOW_SEC: ${PORT_SCAN_MULTI_TARGET_WINDOW_SEC:-30}
      PORT_SCAN_HORIZONTAL_TARGET_THRESHOLD: ${PORT_SCAN_HORIZONTAL_TARGET_THRESHOLD:-3}
      SECURITY_TRUSTED_SOURCE_IPS: ${SECURITY_TRUSTED_SOURCE_IPS:-}
      TRUSTED_HORIZONTAL_SCAN_THRESHOLD: ${TRUSTED_HORIZONTAL_SCAN_THRESHOLD:-10}
      PORT_SCAN_HIGH_UNIQUE_DST_PORT_THRESHOLD: ${PORT_SCAN_HIGH_UNIQUE_DST_PORT_THRESHOLD:-50}
      PORT_SCAN_ALERT_COOLDOWN_SEC: ${PORT_SCAN_ALERT_COOLDOWN_SEC:-60}
      ICMP_PPS_THRESHOLD: ${ICMP_PPS_THRESHOLD:-150}
      ICMP_MIN_PACKET_COUNT: ${ICMP_MIN_PACKET_COUNT:-100}
      ICMP_HIGH_PPS_THRESHOLD: ${ICMP_HIGH_PPS_THRESHOLD:-500}
      ICMP_CRITICAL_PPS_THRESHOLD: ${ICMP_CRITICAL_PPS_THRESHOLD:-1000}
      UDP_PPS_THRESHOLD: ${UDP_PPS_THRESHOLD:-250}
      UDP_MIN_PACKET_COUNT: ${UDP_MIN_PACKET_COUNT:-100}
      UDP_HIGH_PPS_THRESHOLD: ${UDP_HIGH_PPS_THRESHOLD:-800}
      UDP_CRITICAL_PPS_THRESHOLD: ${UDP_CRITICAL_PPS_THRESHOLD:-1500}
      UDP_BPS_THRESHOLD: ${UDP_BPS_THRESHOLD:-2000000}
      UDP_HIGH_BPS_THRESHOLD: ${UDP_HIGH_BPS_THRESHOLD:-8000000}
      UDP_CRITICAL_BPS_THRESHOLD: ${UDP_CRITICAL_BPS_THRESHOLD:-15000000}
      SYN_PPS_THRESHOLD: ${SYN_PPS_THRESHOLD:-120}
      SYN_MIN_COUNT: ${SYN_MIN_COUNT:-30}
      SYN_HIGH_PPS_THRESHOLD: ${SYN_HIGH_PPS_THRESHOLD:-400}
      SYN_CRITICAL_PPS_THRESHOLD: ${SYN_CRITICAL_PPS_THRESHOLD:-800}
      SYN_MAX_UNIQUE_PORTS: ${SYN_MAX_UNIQUE_PORTS:-5}
      EVENT_DEDUP_WINDOW_SEC: ${EVENT_DEDUP_WINDOW_SEC:-60}
      RATE_LIMIT_PRIORITY: ${RATE_LIMIT_PRIORITY:-500}
      RATE_LIMIT_IDLE_TIMEOUT: ${RATE_LIMIT_IDLE_TIMEOUT:-60}
      RATE_LIMIT_HARD_TIMEOUT: ${RATE_LIMIT_HARD_TIMEOUT:-300}
      RATE_LIMIT_PPS: ${RATE_LIMIT_PPS:-100}
      DROP_PRIORITY: ${DROP_PRIORITY:-700}
      DROP_IDLE_TIMEOUT: ${DROP_IDLE_TIMEOUT:-30}
      DROP_HARD_TIMEOUT: ${DROP_HARD_TIMEOUT:-120}
      SECURITY_EVENT_QUEUE_MAX_SIZE: ${SECURITY_EVENT_QUEUE_MAX_SIZE:-500}
      SECURITY_EVENT_SEND_BATCH_SIZE: ${SECURITY_EVENT_SEND_BATCH_SIZE:-100}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://backend:8000}
      BACKEND_API_KEY: ${ANALYZER_API_KEY:?ANALYZER_API_KEY is required}
    cap_add:
      - NET_RAW
      - NET_ADMIN
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: ${FRONTEND_BACKEND_INTERNAL_URL:-http://backend:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws/analyzer}
    container_name: sdn-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      BACKEND_INTERNAL_URL: ${FRONTEND_BACKEND_INTERNAL_URL:-http://backend:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws/analyzer}
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: sdn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sdn_platform}
      POSTGRES_USER: ${POSTGRES_USER:-sdn_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sdn_user} -d ${POSTGRES_DB:-sdn_platform}"
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  influxdb:
    image: influxdb:2.7
    container_name: sdn-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:-sdn_user}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:?INFLUXDB_PASSWORD is required}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-sdn_org}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-sdn_metrics}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?INFLUXDB_TOKEN is required}
    ports:
      - "127.0.0.1:${INFLUXDB_PORT:-8086}:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "influx ping --host http://localhost:8086"
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: sdn-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "127.0.0.1:${ELASTICSEARCH_HTTP_PORT:-9200}:9200"
      - "127.0.0.1:${ELASTICSEARCH_TRANSPORT_PORT:-9300}:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9200/_cluster/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  influxdb_data:
  influxdb_config:
  elasticsearch_data:
