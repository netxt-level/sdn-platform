services:
  backend:
    ports:
      - "${BACKEND_VM_BIND_ADDRESS:?set BACKEND_VM_BIND_ADDRESS to the Multipass host gateway}:8000:8000"

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${BACKEND_POSTGRES_HOST:-postgres}
    volumes:
      - ./alembic.ini:/app/alembic.ini:ro
      - ./migrations:/app/migrations:ro
    command:
      - alembic
      - upgrade
      - head
    depends_on:
      - postgres
