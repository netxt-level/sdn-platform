services:
  analyzer:
    build:
      context: ./analyzer
      dockerfile: Dockerfile
    container_name: sdn-analyzer
    restart: unless-stopped
    network_mode: host
    environment:
      ANALYZER_ID: ${ANALYZER_ID:-analyzer-1}
      ANALYZER_INTERFACE: ${ANALYZER_INTERFACE:-eth0}
      ANALYZER_WINDOW_SEC: ${ANALYZER_WINDOW_SEC:-1}
      ANALYZER_STATUS_INTERVAL_SEC: ${ANALYZER_STATUS_INTERVAL_SEC:-5}
      PORT_SCAN_WINDOW_SEC: ${PORT_SCAN_WINDOW_SEC:-5}
      PORT_SCAN_UNIQUE_DST_PORT_THRESHOLD: ${PORT_SCAN_UNIQUE_DST_PORT_THRESHOLD:-20}
      PORT_SCAN_SYN_COUNT_THRESHOLD: ${PORT_SCAN_SYN_COUNT_THRESHOLD:-20}
      PORT_SCAN_MULTI_TARGET_WINDOW_SEC: ${PORT_SCAN_MULTI_TARGET_WINDOW_SEC:-30}
      PORT_SCAN_MULTI_TARGET_THRESHOLD: ${PORT_SCAN_MULTI_TARGET_THRESHOLD:-3}
      PORT_SCAN_HIGH_UNIQUE_DST_PORT_THRESHOLD: ${PORT_SCAN_HIGH_UNIQUE_DST_PORT_THRESHOLD:-50}
      PORT_SCAN_ALERT_COOLDOWN_SEC: ${PORT_SCAN_ALERT_COOLDOWN_SEC:-60}
      PROTECTED_SERVER_IPS: ${PROTECTED_SERVER_IPS:-10.0.0.100}
      SERVER_EGRESS_ALLOWLIST: ${SERVER_EGRESS_ALLOWLIST:-}
      SERVER_BEHAVIOR_ALERT_COOLDOWN_SEC: ${SERVER_BEHAVIOR_ALERT_COOLDOWN_SEC:-60}
      LATERAL_FANOUT_WINDOW_SEC: ${LATERAL_FANOUT_WINDOW_SEC:-30}
      LATERAL_FANOUT_UNIQUE_DST_THRESHOLD: ${LATERAL_FANOUT_UNIQUE_DST_THRESHOLD:-2}
      LATERAL_FANOUT_CONNECTION_THRESHOLD: ${LATERAL_FANOUT_CONNECTION_THRESHOLD:-3}
      EXFIL_VOLUME_WINDOW_SEC: ${EXFIL_VOLUME_WINDOW_SEC:-10}
      EXFIL_OUTBOUND_BPS_THRESHOLD: ${EXFIL_OUTBOUND_BPS_THRESHOLD:-1000000}
      EXFIL_BASELINE_MULTIPLIER: ${EXFIL_BASELINE_MULTIPLIER:-3.0}
      EXFIL_SUSTAINED_WINDOWS: ${EXFIL_SUSTAINED_WINDOWS:-3}
      C2_BEACON_WINDOW_SEC: ${C2_BEACON_WINDOW_SEC:-300}
      C2_BEACON_MIN_CONNECTIONS: ${C2_BEACON_MIN_CONNECTIONS:-6}
      C2_BEACON_MIN_INTERVAL_SEC: ${C2_BEACON_MIN_INTERVAL_SEC:-20}
      C2_BEACON_MAX_INTERVAL_SEC: ${C2_BEACON_MAX_INTERVAL_SEC:-90}
      C2_BEACON_MAX_JITTER_RATIO: ${C2_BEACON_MAX_JITTER_RATIO:-0.2}
      ICMP_PPS_THRESHOLD: ${ICMP_PPS_THRESHOLD:-1000}
      ICMP_MIN_PACKET_COUNT: ${ICMP_MIN_PACKET_COUNT:-1000}
      ICMP_HIGH_PPS_THRESHOLD: ${ICMP_HIGH_PPS_THRESHOLD:-3000}
      ICMP_HIGH_PPS_MULTIPLIER: ${ICMP_HIGH_PPS_MULTIPLIER:-3.0}
      ICMP_BASELINE_SPIKE_MULTIPLIER: ${ICMP_BASELINE_SPIKE_MULTIPLIER:-5.0}
      ICMP_BASELINE_MIN_PPS: ${ICMP_BASELINE_MIN_PPS:-100}
      ICMP_ALERT_COOLDOWN_SEC: ${ICMP_ALERT_COOLDOWN_SEC:-60}
      EVENT_DEDUP_WINDOW_SEC: ${EVENT_DEDUP_WINDOW_SEC:-60}
      RATE_LIMIT_PRIORITY: ${RATE_LIMIT_PRIORITY:-500}
      RATE_LIMIT_IDLE_TIMEOUT: ${RATE_LIMIT_IDLE_TIMEOUT:-60}
      RATE_LIMIT_HARD_TIMEOUT: ${RATE_LIMIT_HARD_TIMEOUT:-300}
      RATE_LIMIT_PPS: ${RATE_LIMIT_PPS:-100}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:?BACKEND_BASE_URL must point to the host backend}
    cap_add:
      - NET_RAW
      - NET_ADMIN
